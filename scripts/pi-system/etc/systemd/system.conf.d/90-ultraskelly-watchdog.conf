# Reset the Pi when it hangs: systemd feeds the hardware watchdog, which resets the
# board after a minute without it, and after two minutes stuck in a reboot.
# Raspberry Pi OS sets the same in /usr/lib/systemd/system.conf.d/40-rpi-enable-watchdog.conf;
# this keeps it if that default ever changes.
[Manager]
RuntimeWatchdogSec=1min
RebootWatchdogSec=2min

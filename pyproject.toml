[project]
name = "ultraskelly"
version = "0.1.0"
description = "Raspberry Pi animatronic skeleton tracking and control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pydantic>=2.12.3", "aiohttp>=3.14", "freemocap-stream"]

[project.optional-dependencies]
# The Hailo-8 runtime (hailo_platform) and its pose model come from Raspberry Pi OS's hailo-all.
hardware = [
    "adafruit-circuitpython-servokit>=1.3.22",
    "adafruit-circuitpython-motorkit>=1.6.0",
    "opencv-python>=4.10",
    "depthai>=3.11",
]

[dependency-groups]
dev = [
    "cma>=4.5.0",
    "pytest>=8.0",
]

[tool.uv.sources]
# FreeMoCap's stream encoder, from the branch that adapts FreeMoCap's transport for other apps.
freemocap-stream = { git = "https://github.com/freemocap/freemocap", branch = "sfn26-ultraskelly", subdirectory = "packages/freemocap-stream" }

[tool.pytest.ini_options]
testpaths = ["tests"]

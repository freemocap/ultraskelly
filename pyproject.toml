[project]
name = "ultraskelly"
version = "0.1.0"
description = "Raspberry Pi animatronic skeleton tracking and control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pydantic>=2.12.3"]

[project.optional-dependencies]
# Picamera2/libcamera and IMX500 models come from Raspberry Pi OS; see docs/audit-2026.md.
hardware = [
    "adafruit-circuitpython-servokit>=1.3.22",
    "adafruit-circuitpython-motorkit>=1.6.0",
    "opencv-python>=4.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
